services:
  - type: web
    name: learn-flow-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix ./apps/api exec -- prisma generate --schema=apps/api/prisma/schema.prisma && npm --prefix ./apps/api exec -- prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npm --prefix ./apps/api run build
    startCommand: npm --prefix ./apps/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # The API web service should not run BullMQ polling workers. Keeping
      # these disabled prevents continuous Redis queue polling from exhausting
      # the shared Upstash request quota. Queue producers retain their
      # existing inline fallbacks when these features are disabled.
      - key: EMAIL_QUEUE_ENABLED
        value: "false"
      - key: EMAIL_ASYNC_DELIVERY
        value: "true"
      - key: NOTIFICATIONS_QUEUE_ENABLED
        value: "false"
